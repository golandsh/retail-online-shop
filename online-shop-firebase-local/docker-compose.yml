services:
  firebase:
    build: .
    container_name: online-shop-firebase-local
    ports:
      - "4000:4000"  # Emulator UI

      - "4400:4400"  # Emulator Hub
      - "5001:5001"  # Functions Emulator

      - "8080:8080"  # Firestore Emulator
      - "9099:9099"  # Auth Emulator
      - "9199:9199"  # Storage Emulator
    volumes:
      - ./data:/srv/online-shop/online-shop-firebase-local/data
      - ../:/srv/online-shop
      - grocery-import-node-modules:/srv/online-shop/backend/services/grocery-import/node_modules
      - grocery-api-node-modules:/srv/online-shop/backend/services/grocery-api/node_modules
    working_dir: /srv/online-shop/online-shop-firebase-local
    environment:
      - GCLOUD_PROJECT=online-shop-bf396
      - HOST=0.0.0.0
    command: >
      sh -lc "export JAVA_HOME=/opt/java/openjdk
      && export PATH=/opt/java/openjdk/bin:$$PATH
      && cd /srv/online-shop/backend/services/grocery-import
      && npm install --omit=dev --no-package-lock --no-save
      && cd /srv/online-shop/backend/services/grocery-api
      && npm install --omit=dev --no-package-lock --no-save
      && cd /srv/online-shop/online-shop-firebase-local
      && firebase emulators:start --project online-shop-bf396 --import=./data --export-on-exit"
    restart: unless-stopped

volumes:
  grocery-import-node-modules:
  grocery-api-node-modules:
